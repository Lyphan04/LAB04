<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Trang Chủ</title>
</head>
<body>
<section layout:fragment="content" class="container mt-5 text-center">
    <div class="p-5 mb-4 bg-light rounded-3">
        <h1 class="display-5 fw-bold">Hệ Thống Quản Lý Bán Hàng</h1>
        <p class="lead">Chào mừng đến với hệ thống quản lý sản phẩm và danh mục.</p>
        <div class="d-grid gap-2 d-md-flex justify-content-md-center mt-4">
            <a th:href="@{/products}" class="btn btn-primary btn-lg px-4 me-md-2">Quản Lý Sản Phẩm</a>
            <a th:href="@{/categories}" class="btn btn-outline-secondary btn-lg px-4 me-md-2">Quản Lý Danh Mục</a>
            <a th:href="@{/sinhvien}" class="btn btn-outline-success btn-lg px-4">Quản Lý Sinh Viên</a>
        </div>
    </div>
</section>
</body>
</html>
