<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Nhập Sinh Viên</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<section layout:fragment="content" class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">Nhập Sinh Viên Mới</h3>
                </div>
                <div class="card-body">
                    <form th:action="@{/sinhvien/add}" th:object="${sinhvien}" method="post">
                        <div class="mb-3">
                            <label for="maSv" class="form-label">Mã sinh viên:</label>
                            <input type="text" th:field="*{maSv}" class="form-control" id="maSv" required>
                        </div>
                        <div class="mb-3">
                            <label for="hoTen" class="form-label">Họ và tên:</label>
                            <input type="text" th:field="*{hoTen}" class="form-control" id="hoTen" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email:</label>
                            <input type="email" th:field="*{email}" class="form-control" id="email">
                        </div>
                        <div class="mb-3">
                            <label for="soDienThoai" class="form-label">Số điện thoại:</label>
                            <input type="text" th:field="*{soDienThoai}" class="form-control" id="soDienThoai">
                        </div>
                        <div class="mb-3">
                            <label for="diaChi" class="form-label">Địa chỉ:</label>
                            <input type="text" th:field="*{diaChi}" class="form-control" id="diaChi">
                        </div>
                        <button type="submit" class="btn btn-primary">Xác nhận</button>
                        <a th:href="@{/sinhvien}" class="btn btn-secondary">Hủy</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
